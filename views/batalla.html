<!DOCTYPE html>
<html lang="es">
<head><style>body{background:#1a1a2e}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla en la Cima — Wind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/css/base.css?v={{ cacheVersion }}">
    <link rel="stylesheet" href="/css/home.css?v={{ cacheVersion }}">
    <link rel="stylesheet" href="/css/menu.css?v={{ cacheVersion }}">
    <link rel="stylesheet" href="/css/batalla.css?v={{ cacheVersion }}">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/animaciones.css?v={{ cacheVersion }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wind">
    <link rel="apple-touch-icon" href="/img/app.png">
    <link rel="icon" href="/img/logo2.png">
    <meta name="theme-color" content="#ff4500" id="meta-theme-color">
</head>
<body>
    <script src="/js/menu.js?v={{ cacheVersion }}"></script>
    <div class="app-layout">
        <div id="menu-placeholder"></div>
        <main class="contenido-principal anim-fade-in">
            <a href="/ranking-game" class="btn-retroceder" aria-label="Volver">
                <span class="material-symbols-outlined back-icon">arrow_back</span>
                Atrás
            </a>

            <section id="batalla-espera" class="batalla-section" style="display:none;">
                <div class="batalla-espera-content">
                    <span class="material-symbols-outlined batalla-espera-icon">hourglass_empty</span>
                    <h2>Esperando participantes...</h2>
                    <p id="batalla-espera-texto">Espera a que los demás jugadores completen la batalla.</p>
                    <div class="batalla-participantes-status" id="batalla-status-lista"></div>
                </div>
            </section>

            <section id="batalla-preguntas" class="batalla-section" style="display:none;">
                <div class="batalla-header">
                    <div class="batalla-progress-wrap">
                        <div class="batalla-progress-bar" id="batalla-progress-bar">
                            <div class="batalla-progress-fill" id="batalla-progress-fill"></div>
                        </div>
                        <span id="batalla-progress-text" class="batalla-progress-text">1 / 10</span>
                    </div>
                    <div class="batalla-timer" id="batalla-timer">
                        <span class="material-symbols-outlined">schedule</span>
                        <span id="batalla-timer-num">15s</span>
                    </div>
                </div>

                <div class="batalla-card" id="batalla-card">
                    <div class="batalla-question-num" id="batalla-qnum">Pregunta 1</div>
                    <p class="batalla-question" id="batalla-pregunta"></p>
                    <div class="batalla-opciones" id="batalla-opciones"></div>
                </div>

                <button id="batalla-finalizar" class="batalla-btn batalla-btn-final" style="display:none;">Finalizar batalla</button>
            </section>

            <section id="batalla-completado" class="batalla-section" style="display:none;">
                <div class="batalla-completado-content">
                    <span class="material-symbols-outlined batalla-completado-icon">check_circle</span>
                    <h2>¡Batalla completada!</h2>
                    <p id="batalla-completado-texto"></p>
                    <a href="/ranking-game" class="batalla-btn" style="margin-top:20px;">Volver al ranking</a>
                </div>
            </section>
        </main>
    </div>
    <script src="/js/batalla.js?v={{ cacheVersion }}"></script>
</body>
</html>
