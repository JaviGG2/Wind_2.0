<!DOCTYPE html>
<html lang="es">
<head><style>body{background:#1a1a2e}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking — Wind</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="description" content="Ranking global de jugadores de Wind. Compite por los primeros lugares.">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/css/base.css?v={{ cacheVersion }}">
    <link rel="stylesheet" href="/css/home.css?v={{ cacheVersion }}">
    <link rel="stylesheet" href="/css/menu.css?v={{ cacheVersion }}">
   
    <link rel="stylesheet" href="/css/ranking-game.css?v={{ cacheVersion }}">
    <link rel="stylesheet" href="/css/info-popup.css?v={{ cacheVersion }}">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/animaciones.css?v={{ cacheVersion }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Wind">
    <link rel="apple-touch-icon" href="/img/app.png">
    <link rel="icon" href="/img/logo2.png">
    <meta name="theme-color" content="#ff4500" id="meta-theme-color">
</head>
<body>
    <script src="/js/menu.js?v={{ cacheVersion }}"></script>
    

    <div class="app-layout">
        <div id="buscar-placeholder"></div>
        <div id="menu-placeholder"></div>

      
        <main class="contenido-principal anim-fade-down">

            <a href="/juegos" class="btn-retroceder" aria-label="Volver">
            <span class="material-symbols-outlined back-icon">arrow_back</span>
                Atrás
             <span class="back-text"></span>
            </a>
            


            <section class="ranking-hero">
                <div class="ranking-hero-content">
                    <div class="ranking-hero-icon">
                        <span class="img"><img src="/img/Ranking.png" alt="Ranking"></span>
                    </div>
                    <h1 class="ranking-hero-title">Ranking Global</h1>
                    <div style="display:flex;justify-content:center;">
                        <button type="button" class="btn-info-icono" data-info="batalla-ranking" aria-label="Cómo funciona la batalla">
                            <span class="material-symbols-outlined">help</span>
                        </button>
                    </div>
                    <div id="top3-podium" class="top3-podium" aria-label="Top 3 del ranking"></div>
                </div>
            </section>

            <section class="ranking-section">
                <div class="ranking-header">
                    <h2>Clasificación</h2>
                    <span id="ranking-count" class="ranking-count">—</span>
                </div>
                <div id="ranking-lista" class="ranking-lista">
                    <img src="/images/loading.svg" class="anim-loading" alt="Cargando...">
                </div>
            </section>

        </main>
    </div>

    <script src="/js/ranking-game.js?v={{ cacheVersion }}"></script>
    <script type="module" src="/js/info-burbuja.js?v={{ cacheVersion }}"></script>
</body>
</html>
